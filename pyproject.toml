[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlcog"
version = "1.4.0"
description = "Quantum-like, quantum and quantum-inspired models with classical baselines, Qiskit circuits and a 3D Bloch-sphere viewer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yeshwanth Guru", email = "yeshwanth445@gmail.com"},
]
maintainers = [
  {name = "Yeshwanth Guru", email = "yeshwanth445@gmail.com"},
]
keywords = ["quantum cognition", "quantum-like models", "quantum machine learning", "quantum-inspired algorithms", "robotics",
            "human-robot interaction", "quantum probability", "decision making", "qiskit", "QAOA", "VQE",
            "tensor networks", "Bloch sphere", "visualization", "cognitive modelling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Topic :: Scientific/Engineering :: Visualization",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Development Status :: 4 - Beta",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/yeshwanthguru/quantum-cognition-robotics"
Issues = "https://github.com/yeshwanthguru/quantum-cognition-robotics/issues"
Documentation = "https://github.com/yeshwanthguru/quantum-cognition-robotics/blob/main/docs/concepts.md"
Changelog = "https://github.com/yeshwanthguru/quantum-cognition-robotics/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qiskit = ["qiskit>=2.0", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.40"]
cloud = ["qiskit-ibm-runtime>=0.40", "amazon-braket-sdk>=1.80"]
viz = ["matplotlib>=3.7", "plotly>=5.18", "ipywidgets>=8", "anywidget>=0.9", "seaborn>=0.12"]
all = ["qiskit>=2.0", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.40", "amazon-braket-sdk>=1.80",
       "matplotlib>=3.7", "plotly>=5.18", "ipywidgets>=8", "anywidget>=0.9", "seaborn>=0.12"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6", "build>=1", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E701", "E702", "E731", "E741", "E402", "E401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"examples/*" = ["E501"]
"site/*" = ["E501"]
