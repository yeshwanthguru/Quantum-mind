<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="quantum-cognition-robotics: quantum-like, quantum and quantum-inspired models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b33"/>
      <stop offset="1" stop-color="#1f1240"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#79c0ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3b5bdb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#b9c6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#79c0ff" stroke-width="1">
    <path d="M0 250 C 200 200, 400 290, 600 240 S 1000 190, 1200 240" fill="none"/>
    <path d="M0 270 C 220 230, 420 300, 640 262 S 1020 220, 1200 262" fill="none"/>
  </g>
  <!-- Bloch sphere -->
  <g transform="translate(170,150)">
    <circle r="104" fill="url(#sphere)" stroke="#58a6ff" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse rx="104" ry="30" fill="none" stroke="#8b949e" stroke-opacity="0.7" stroke-width="1.4"/>
    <ellipse rx="30" ry="104" fill="none" stroke="#8b949e" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#8b949e" stroke-dasharray="4 4" stroke-width="1.2"/>
    <line x1="-122" y1="0" x2="122" y2="0" stroke="#8b949e" stroke-dasharray="4 4" stroke-width="1.2"/>
    <path d="M 0 -104 A 104 104 0 0 1 72 -40" fill="none" stroke="#d2a8ff" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="72" y2="-60" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="-60" r="9" fill="#ff7b72"/>
    <text x="0" y="-128" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">|0⟩</text>
    <text x="0" y="142" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">|1⟩</text>
  </g>
  <text x="330" y="112" fill="url(#title)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700">quantum-cognition-robotics</text>
  <text x="332" y="152" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">Quantum-like, quantum and quantum-inspired models for robots, agents and people</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="332" y="186" width="196" height="40" rx="20" fill="#ff7b72" fill-opacity="0.16" stroke="#ff7b72"/>
    <text x="430" y="212" fill="#ffb3ad" text-anchor="middle">quantum-like</text>
    <rect x="544" y="186" width="150" height="40" rx="20" fill="#79c0ff" fill-opacity="0.16" stroke="#79c0ff"/>
    <text x="619" y="212" fill="#a5d6ff" text-anchor="middle">quantum</text>
    <rect x="710" y="186" width="218" height="40" rx="20" fill="#d2a8ff" fill-opacity="0.16" stroke="#d2a8ff"/>
    <text x="819" y="212" fill="#e2c5ff" text-anchor="middle">quantum-inspired</text>
    <rect x="944" y="186" width="200" height="40" rx="20" fill="#7ee787" fill-opacity="0.14" stroke="#7ee787"/>
    <text x="1044" y="212" fill="#aff5b4" text-anchor="middle">3D Bloch viewer</text>
  </g>
  <text x="332" y="262" fill="#6e7681" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17">python package: qlcog  ·  Qiskit  ·  IBM Quantum  ·  Amazon Braket  ·  Apache-2.0</text>
