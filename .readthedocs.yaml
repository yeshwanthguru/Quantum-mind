# Read the Docs configuration: the same Sphinx documentation as the GitHub Pages site.
# Import the repository at https://readthedocs.org to publish it at <project>.readthedocs.io.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
sphinx:
  configuration: docs/conf.py
python:
  install:
    - method: pip
      path: .
      extra_requirements: [all, docs]
