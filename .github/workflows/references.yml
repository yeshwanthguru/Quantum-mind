name: references
# Looks every documentation reference up in Crossref and uploads a report (references_report.md).
# Run it by hand from the Actions tab; it changes nothing in the repository.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Look the references up in Crossref
        run: python docs/_ext/check_refs.py
      - uses: actions/upload-artifact@v4
        with:
          name: references-report
          path: references_report.md
