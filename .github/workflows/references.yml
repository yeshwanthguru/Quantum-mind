name: references
# Looks every reference in the Foundations pages and the model atlas up in Crossref, and builds a
# BibTeX file from the confirmed matches. Run it by hand from the Actions tab; it changes nothing in
# the repository. Download the "references" artifact, review references_report.md, then commit
# references.bib if it is right.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Look the references up in Crossref and build references.bib
        run: python docs/_ext/check_refs.py --bib
      - name: Show the report and the BibTeX file in the log
        run: cat references_report.md references.bib
      - uses: actions/upload-artifact@v4
        with:
          name: references
          path: |
            references_report.md
            references.bib
