name: debug-api-generation
on:
  push:
    branches: [develop]
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Show generated API diff
        run: |
          python docs/make_api.py
          git diff --no-ext-diff -- docs/API.md
