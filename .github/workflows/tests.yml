name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests examples docs
      - name: Unit tests
        run: pytest -q
      - name: Examples (smoke test)
        run: |
          for f in examples/0*.py examples/10_*.py examples/12_*.py examples/1[4-9]_*.py examples/20_*.py; do
            echo "::group::$f"; python -W ignore "$f" > /dev/null; echo "::endgroup::"
          done
