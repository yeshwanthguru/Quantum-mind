name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests examples docs
      - name: API reference is up to date
        run: python docs/make_api.py --check
      - name: Unit tests with coverage
        run: pytest -q --cov=qlcog --cov-report=term --cov-fail-under=80
      - name: Examples (smoke test)
        run: |
          for f in examples/0*.py examples/10_*.py examples/12_*.py examples/1[4-9]_*.py examples/2*.py; do
            echo "::group::$f"; python -W ignore "$f" > /dev/null; echo "::endgroup::"
          done
          python -W ignore examples/13_quantum_classifiers_triage.py --quick > /dev/null
          python -W ignore examples/11_cloud_run.py --dry-run > /dev/null
      - name: Notebooks
        run: |
          python - <<'PY'
          import glob, nbformat, nbclient
          for f in sorted(glob.glob('notebooks/*.ipynb')):
              nb = nbformat.read(f, 4)
              nbclient.NotebookClient(nb, timeout=900, kernel_name='python3', resources={'metadata': {'path': 'notebooks'}}).execute()
              print('executed', f)
          PY
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/core && /tmp/core/bin/pip install dist/*.whl
          cd /tmp && /tmp/core/bin/python -c "import qlcog, qlcog.quantum, qlcog.inspired, qlcog.problems, qlcog.viz; print('core install OK', qlcog.__version__)"
